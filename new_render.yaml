projects:
- name: Blueprint Project
  environments:
  - name: Staging
    services:
    - type: web
      name: flask-hello-world
      runtime: python
      repo: https://github.com/adirksmeier-render/flask-hello-world
      plan: starter
      envVars:
      - key: DUMMY_VARIABLE
        value: newValueBP_noAddChngs
      - key: BLUEPRINT_VARIABLE
        value: testingBlue
      region: virginia
      buildCommand: pip install -r requirements.txt
      startCommand: gunicorn app:app
      autoDeployTrigger: commit
    databases:
    - name: test_logical_replication
      databaseName: test_logical_replication
      user: new_dashboard_user
      plan: pro-4gb
      region: virginia
      ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
      postgresMajorVersion: "18"
      diskSizeGB: 60
